services:
  app:
    build:
      context: .
      args:
        # Both are build-time inputs: NEXT_PUBLIC_* is frozen into the client
        # bundle, and the encryption key is embedded in the build output.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    image: weact-xiaobenben
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Read at runtime by the server only — never inlined into the client bundle.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/weact}
      # Admin credential for /admin. Interpolated from `.env` or the calling
      # shell — NOT from `.env.local`, which only Next.js reads. The `:-` form
      # means an unset variable passes through as empty rather than warning;
      # empty closes the admin area, which is the safe direction.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      # The app must not start before the schema exists: its very first query
      # would hit tables that have not been created. Depending on `migrate`
      # covers `db` being healthy too — migrate waits for that itself.
      #
      # Consequence worth knowing: a failed migration stops the app from
      # starting at all, rather than letting it come up against a half-built
      # schema. That is the intended direction.
      migrate:
        condition: service_completed_successfully

  # Applies everything in ./drizzle, then exits. Runs on every `up`, and is a
  # no-op after the first: drizzle-kit records what it has applied in
  # drizzle.__drizzle_migrations.
  migrate:
    build:
      context: .
      target: migrator
    image: weact-xiaobenben-migrate
    # A one-shot job, not a server — restarting it on exit would loop.
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/weact}
    depends_on:
      db:
        condition: service_healthy

  # The app and `migrate` both read this. It holds the users/sessions tables and
  # `drizzle.__drizzle_migrations`.
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weact
    # Published so `npm run dev` on the host can reach it at localhost:5432.
    # Change to "5433:5432" if you already run PostgreSQL on the host, and
    # update DATABASE_URL to match.
    ports:
      - "5432:5432"
    volumes:
      # Mount the PARENT, not /var/lib/postgresql/data. Postgres 18 changed the
      # layout: PGDATA is now the versioned /var/lib/postgresql/18/docker, and
      # the image refuses to start if it finds a mount at the old path. Worse,
      # the old path still "works" as a mount — it just never receives any
      # writes, so the named volume would sit empty and every restart would
      # silently start from a fresh database.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weact"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:
